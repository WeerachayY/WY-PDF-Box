<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="100%"
  height="100%"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">PDF Box</title>
  <desc id="desc">
    Minimal document icon showing a PDF file emerging from an outlined box.
  </desc>

  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="14"
        flood-color="#273042"
        flood-opacity="0.13"
      />
    </filter>

    <filter id="labelShadow" x="-15%" y="-30%" width="130%" height="170%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="7"
        flood-color="#7B0D12"
        flood-opacity="0.20"
      />
    </filter>

    <linearGradient id="paperGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F9FB"/>
    </linearGradient>

    <linearGradient id="labelGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8171E"/>
      <stop offset="50%" stop-color="#E82A31"/>
      <stop offset="100%" stop-color="#C8171E"/>
    </linearGradient>
  </defs>

  <!-- Document base -->
  <path
    d="
      M100 34
      H330
      L430 134
      V442
      C430 462 414 478 394 478
      H100
      C80 478 64 462 64 442
      V70
      C64 50 80 34 100 34
      Z
    "
    fill="url(#paperGradient)"
    stroke="#E1E4EA"
    stroke-width="3"
    filter="url(#paperShadow)"
  />

  <!-- Folded corner -->
  <path
    d="
      M330 34
      L430 134
      H372
      C349 134 330 115 330 92
      Z
    "
    fill="#E3E6EC"
  />

  <path
    d="
      M330 34
      V92
      C330 115 349 134 372 134
      H430
    "
    fill="none"
    stroke="#CDD2DB"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- WY -->
  <text
    x="90"
    y="85"
    font-family="Google Sans, sans-serif"
    font-size="40"
    font-weight="650"
    letter-spacing="1.2"
    fill="#858B99"
  >
    WY
  </text>

  <!-- Very subtle background -->
  <circle
    cx="247"
    cy="240"
    r="108"
    fill="#FFF7F7"
  />

  <!-- =====================================
       MINIMAL PDF INSIDE OUTLINE BOX
  ====================================== -->

  <g
    fill="none"
    stroke="#E62930"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >

    <!-- Back edge of the box -->
    <path
      d="
        M164 245
        L247 211
        L330 245
      "
      opacity="0.55"
    />

    <!-- PDF document -->
    <path
      d="
        M211 246
        V158
        C211 149 218 142 227 142
        H270
        L294 166
        V246
      "
      fill="#FFFFFF"
    />

    <!-- PDF folded corner -->
    <path
      d="
        M270 142
        V158
        C270 163 274 167 279 167
        H294
      "
      stroke-width="5"
    />

    <!-- Inner bottom edges behind the front wall -->
    <path
      d="
        M164 245
        L247 278
        L330 245
      "
      opacity="0.45"
    />

    <!-- Left upper rim -->
    <path
      d="
        M164 245
        L208 226
      "
    />

    <!-- Right upper rim -->
    <path
      d="
        M330 245
        L294 230
      "
    />

    <!-- Left side wall -->
    <path
      d="
        M164 245
        V301
        C164 315 172 327 185 333
        L247 361
      "
    />

    <!-- Right side wall -->
    <path
      d="
        M330 245
        V301
        C330 315 322 327 309 333
        L247 361
      "
    />

    <!-- Front upper edge -->
    <path
      d="
        M164 245
        L247 281
        L330 245
      "
      stroke-width="8"
    />

    <!-- Front center seam -->
    <path
      d="
        M247 281
        V361
      "
      stroke-width="5"
      opacity="0.45"
    />

  </g>

  <!-- PDF label -->
  <rect
    x="228"
    y="178"
    width="50"
    height="27"
    rx="8"
    fill="#E62930"
  />

  <text
    x="253"
    y="196.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="0.8"
    fill="#FFFFFF"
  >
    PDF
  </text>

  <!-- Document detail lines -->
  <path
    d="M231 220 H274"
    fill="none"
    stroke="#D7DBE3"
    stroke-width="5"
    stroke-linecap="round"
  />

  <path
    d="M231 237 H262"
    fill="none"
    stroke="#D7DBE3"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- =====================================
       PDF BOX LABEL
  ====================================== -->

  <!-- Rear ribbon folds -->


  <!-- Main label -->
  <rect
    x="55"
    y="380"
    width="350"
    height="76"
    rx="20"
    fill="url(#labelGradient)"
    filter="url(#labelShadow)"
  />

  <!-- Subtle top highlight -->


  <!-- Label text -->
  <text
    x="200"
    y="440"
    text-anchor="middle"
    font-family="Google Sans, sans-serif"
    font-size="63"
    font-weight="650"
    letter-spacing="0.2"
    fill="#FFFFFF"
  >
    Pdf Box
  </text>
</svg>